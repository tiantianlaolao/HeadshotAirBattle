plugins { id 'com.android.application' }
android {
    namespace 'com.headshotairbattle.trainingtest'
    compileSdk 35
    defaultConfig {
        applicationId 'com.headshotairbattle.mobiletest'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.2.2-integration'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes { release { minifyEnabled false } }
    if (System.getenv('MOBILE_TEST_KEYSTORE_PATH')) {
        signingConfigs.debug {
            storeFile file(System.getenv('MOBILE_TEST_KEYSTORE_PATH'))
            storePassword System.getenv('MOBILE_TEST_PASSWORD')
            keyAlias 'mobiletest'
            keyPassword System.getenv('MOBILE_TEST_PASSWORD')
        }
    }
    if (project.hasProperty('mobileAssetsDir')) {
        sourceSets.main.assets.srcDirs = [project.property('mobileAssetsDir')]
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
