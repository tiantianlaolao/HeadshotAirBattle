plugins { id 'com.android.application' }
def originalApp = project.hasProperty('originalApp')
if(originalApp && (!project.hasProperty('originalVersionCode') || Integer.parseInt(project.property('originalVersionCode'))<=4)) throw new GradleException('An explicit original version code above verified Play version 4 is required')
android {
    namespace 'com.headshotairbattle.trainingtest'
    compileSdk 36
    defaultConfig {
        applicationId originalApp ? 'com.headshotairbattle' : 'com.headshotairbattle.mobiletest'
        minSdk 26
        targetSdk 36
        versionCode originalApp ? Integer.parseInt(project.property('originalVersionCode')) : 21
        versionName originalApp ? '1.1' : '0.2.19-integration'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    if(originalApp){
        if(!System.getenv('YJ_ORIGINAL_UPLOAD_KEYSTORE_PATH') || !System.getenv('YJ_ORIGINAL_UPLOAD_PASSWORD')) throw new GradleException('Original upload signing credentials are required')
        signingConfigs { originalUpload { storeFile file(System.getenv('YJ_ORIGINAL_UPLOAD_KEYSTORE_PATH'));storePassword System.getenv('YJ_ORIGINAL_UPLOAD_PASSWORD');keyAlias 'yijiang-upload';keyPassword System.getenv('YJ_ORIGINAL_UPLOAD_PASSWORD') } }
    }
    buildTypes { release { minifyEnabled false; if(originalApp) signingConfig signingConfigs.originalUpload } }

    if (System.getenv('MOBILE_TEST_KEYSTORE_PATH')) {
        signingConfigs.debug {
            storeFile file(System.getenv('MOBILE_TEST_KEYSTORE_PATH'))
            storePassword System.getenv('MOBILE_TEST_PASSWORD')
            keyAlias 'mobiletest'
            keyPassword System.getenv('MOBILE_TEST_PASSWORD')
        }
    }
    if (project.hasProperty('mobileAssetsDir')) {
        sourceSets.main.assets.srcDirs = [project.property('mobileAssetsDir')]
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
