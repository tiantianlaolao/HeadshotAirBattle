name: TrainingTest
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.1.0
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  TrainingTest:
    type: application
    platform: iOS
    dependencies:
      - package: GoogleSignIn
    sources:
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: TrainingApp.swift
      - path: LocalServer.swift
      - path: AccountBridge.swift
      - path: Smoke.js
        buildPhase: resources
      - path: SmokeAccount.js
        buildPhase: resources
      - path: build/site
        type: folder
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.headshotairbattle.trainingtest
        CODE_SIGN_ENTITLEMENTS: Account.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Simulator.entitlements
        DEVELOPMENT_TEAM: 8J6A847P66
        YJ_SIGN_STYLE: Automatic
        CODE_SIGN_STYLE: $(YJ_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: $(YJ_PROFILE)
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        CURRENT_PROJECT_VERSION: 17
        MARKETING_VERSION: '0.2.17'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Training Test
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    info:
      path: build/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        GIDClientID: $(YJ_GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(YJ_GOOGLE_IOS_REVERSED_CLIENT_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
