name: TrainingTest
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  TrainingTest:
    type: application
    platform: iOS
    sources:
      - path: TrainingApp.swift
      - path: LocalServer.swift
      - path: AccountBridge.swift
      - path: Smoke.js
        buildPhase: resources
      - path: SmokeAccount.js
        buildPhase: resources
      - path: build/site
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.headshotairbattle.trainingtest
        CODE_SIGN_ENTITLEMENTS: Account.entitlements
        CURRENT_PROJECT_VERSION: 14
        MARKETING_VERSION: '0.2.14'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Training Test
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    info:
      path: build/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
