include:
  - project.yml
targets:
  TrainingTest:
    configFiles:
      Debug: GoogleOriginalApp.xcconfig
      Release: GoogleOriginalApp.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.headshotairbattle
        CURRENT_PROJECT_VERSION: 58
        MARKETING_VERSION: '1.1'
        INFOPLIST_KEY_CFBundleDisplayName: Yijiang
    info:
      properties:
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
